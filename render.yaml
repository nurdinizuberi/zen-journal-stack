services:
  - type: web
    name: zen-journal-backend
    env: node
    region: oregon
    plan: free
    rootDir: zen-journal-stack/backend
    buildCommand: "npm install && npx prisma generate"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://USER:PASSWORD@HOST:5432/DB_NAME?sslmode=require
      - key: CORS_ORIGIN
        value: https://zen-journal-stack.vercel.app
      - key: PUBLIC_BASE_URL
        value: https://zen-journal-stack.onrender.com
      - key: GEMINI_API_KEY
        sync: false